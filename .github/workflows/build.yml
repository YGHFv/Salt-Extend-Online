name: Verify and Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salt-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: Host-Free Regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate metadata, core, QR security, HTTP and cache contracts
        shell: pwsh
        run: ./scripts/test-offline.ps1 -JdkHome $env:JAVA_HOME
      - name: Check patch whitespace
        run: git show --format= --check HEAD
      - name: Test release validation
        run: python scripts/test-ci-release.py

  package:
    name: Salt 1.19.3 Package
    needs: offline
    # Never execute untrusted pull requests on a machine with the proprietary host.
    if: >-
      github.repository == 'YGHFv/Salt-Extend-Online' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.SALT_PACKAGE_ENABLED == 'true'
    runs-on: [self-hosted, Windows, X64, salt-1.19.3]
    environment: salt-build
    timeout-minutes: 45
    env:
      SALT_HOME: ${{ vars.SALT_HOME }}
      SALT_JDK_HOME: ${{ vars.SALT_JDK_HOME }}
      SALT_KOTLIN_HOME: ${{ vars.SALT_KOTLIN_HOME }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check local build prerequisites
        shell: pwsh
        run: |
          if (-not $env:SALT_HOME -or -not $env:SALT_JDK_HOME) {
            throw 'Configure SALT_HOME and SALT_JDK_HOME in the salt-build environment.'
          }
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python 3 is required on the runner.' }
      - name: Verify pinned compiler tools
        shell: pwsh
        run: |
          if (-not $env:SALT_KOTLIN_HOME) { throw 'Configure the persistent Kotlin compiler cache.' }
          ./scripts/setup-native-ui.ps1 -ToolDirectory $env:SALT_KOTLIN_HOME
          $localTools = Join-Path $env:GITHUB_WORKSPACE '.tools/kotlin-2.4.0'
          New-Item -ItemType Directory -Path $localTools -Force | Out-Null
          Copy-Item -LiteralPath (Get-ChildItem -LiteralPath $env:SALT_KOTLIN_HOME -File).FullName -Destination $localTools
      - name: Compile and run full native regression
        shell: pwsh
        run: ./scripts/build-local.ps1 -SaltHome $env:SALT_HOME -JdkHome $env:SALT_JDK_HOME -Experimental
      - name: Verify real isolated Edge launch with synthetic data
        shell: pwsh
        run: |
          $build = Get-ChildItem -LiteralPath 'plugin/build/local' -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $configs = @(Get-ChildItem -LiteralPath (Join-Path $env:SALT_HOME 'app') -Filter '*.cfg')
          if ($configs.Count -ne 1) { throw 'Expected one Salt configuration.' }
          $config = Get-Content -LiteralPath $configs[0].FullName -Raw
          if ($config -notmatch '(?m)^app\.classpath=\$APPDIR[\\/](.+)\r?$') { throw 'Missing host classpath.' }
          $hostPackage = Join-Path (Join-Path $env:SALT_HOME 'app') $Matches[1].Trim()
          $classpath = "$($build.FullName)/test-classes;$($build.FullName)/classes;$hostPackage"
          & (Join-Path $env:SALT_JDK_HOME 'bin/java.exe') --enable-native-access=ALL-UNNAMED "-Djava.io.tmpdir=$($build.FullName)/tmp" -cp $classpath io.github.yghfv.saltneri.plugin.auth.WindowsNativeWebLoginProbe --explicit-headless-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Isolated native Edge compatibility regression failed.' }
          $bass = Join-Path $env:SALT_HOME 'app/resources/bass.dll'
          & (Join-Path $env:SALT_JDK_HOME 'bin/java.exe') --enable-native-access=ALL-UNNAMED "-Djava.io.tmpdir=$($build.FullName)/tmp" "-Dsalt.cast.bassLibraryPath=$bass" -cp $classpath io.github.yghfv.saltneri.plugin.auth.WindowsMusicKitPcmProbe --explicit-headless-fixture $bass
          if ($LASTEXITCODE -ne 0) { throw 'Apple browser PCM to native BASS regression failed.' }
      - name: Identify validated artifact
        id: artifact
        shell: pwsh
        run: |
          $metadata = Get-Content -LiteralPath plugin.properties -Raw | ConvertFrom-StringData
          $path = "plugin/build/libs/plugin-$($metadata.id)-$($metadata.version).spmod"
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($path))" | Set-Content -LiteralPath "$path.sha256" -Encoding ascii
          "path=$path" >> $env:GITHUB_OUTPUT
          "name=Salt-Extend-Online-$($metadata.version)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove this job's temporary build data
        if: always()
        shell: pwsh
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          foreach ($relative in @('plugin/build', 'core/build', 'scripts/__pycache__', '.tools')) {
            $target = [IO.Path]::GetFullPath((Join-Path $workspace $relative))
            if (-not $target.StartsWith($workspace + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Cleanup target escaped the checkout.'
            }
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          }

  release:
    name: Publish Development Release
    needs: [offline, package]
    if: >-
      github.repository == 'YGHFv/Salt-Extend-Online' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.SALT_PACKAGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: Salt-Extend-Online-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify and publish versioned mod and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py --artifact-dir release-artifacts
